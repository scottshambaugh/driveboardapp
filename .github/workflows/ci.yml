name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      # avr-gcc / simavr are absent here, so the firmware + simavr tests
      # self-skip; this job covers all Python behavior on every OS.
      - name: Run tests
        run: uv run pytest backend/tests -v

  coverage:
    name: Safety coverage report
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Coverage for the driveboard safety driver
        run: |
          uv run coverage run --source=backend -m pytest backend/tests -q
          uv run coverage report -m --include="*/driveboard.py"

  firmware:
    name: Firmware build + simavr
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain + simavr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc simavr libsimavr-dev libelf-dev
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Compile variants, boot in simavr, run firmware safety suite
        run: >
          uv run pytest -v
          backend/tests/test_firmware.py
          backend/tests/test_simavr.py
          backend/tests/test_firmware_safety.py

  frontend:
    name: Frontend JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check all frontend JS
        run: |
          set -e
          shopt -s nullglob
          files=(frontend/*.js frontend/js/*.js frontend_mill/*.js frontend_mill/js/*.js)
          echo "Checking ${#files[@]} JS files"
          for f in "${files[@]}"; do
            node --check "$f"
          done
